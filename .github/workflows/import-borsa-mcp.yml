
name: Borsa MCP - Import Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Checkout original Borsa MCP
        uses: actions/checkout@v4
        with:
          repository: saidsurucu/borsa-mcp
          path: source
          fetch-depth: 1

      - name: Copy source into separate folder
        run: |
          mkdir -p borsa-mcp
          rsync -a --exclude='.git' source/ borsa-mcp/

      - name: Save imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add borsa-mcp
          git add -f borsa-mcp/borsa_models.py

          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "Import Borsa MCP source"
            git push
          fi
