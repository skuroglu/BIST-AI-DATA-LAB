
name: Borsa MCP - Financial Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketi kur
        working-directory: borsa-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Finansal tablolar ve finansal oranlar testi
        working-directory: borsa-mcp
        run: |
          python - <<'PY'
          import asyncio
          from fastmcp import Client
          from unified_mcp_server import app

          async def main():
              tickers = ["GARAN", "ISCTR", "AKBNK", "TSKB"]

              async with Client(app) as client:

                  print("\n========== 1. FINANSAL TABLOLAR ==========")

                  statements = await client.call_tool(
                      "get_financial_statements",
                      {
                          "symbol": tickers,
                          "market": "bist",
                          "statement_type": "all",
                          "period": "quarterly",
                          "last_n": 8
                      }
                  )

                  if statements.is_error:
                      raise RuntimeError(
                          f"Finansal tablolar hatasi: {statements}"
                      )

                  for item in statements.content:
                      print(getattr(item, "text", str(item)))

                  print("\n========== 2. FINANCIAL RATIOS ==========")

                  ratios = await client.call_tool(
                      "get_financial_ratios",
                      {
                          "symbol": tickers,
                          "market": "bist",
                          "ratio_set": "comprehensive"
                      }
                  )

                  if ratios.is_error:
                      raise RuntimeError(
                          f"Financial ratios hatasi: {ratios}"
                      )

                  if not ratios.content:
                      raise RuntimeError(
                          "Financial ratios verisi bos geldi."
                      )

                  for item in ratios.content:
                      print(getattr(item, "text", str(item)))

                  print("\n========== TEST TAMAMLANDI ==========")

          asyncio.run(main())
          PY
