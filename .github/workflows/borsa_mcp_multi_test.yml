
name: Borsa MCP - Multi Stock Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketi kur
        working-directory: borsa-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Gercek arac isimlerini bul
        working-directory: borsa-mcp
        run: |
          python - <<'PY'
          import asyncio
          from fastmcp import Client
          from unified_mcp_server import app

          async def main():
              async with Client(app) as client:
                  tools = await client.list_tools()

                  print("\n--- SISTEMDEKI TEMETTU VE KURUMSAL ISLEM ARACLARI ---")

                  found = 0
                  for tool in tools:
                      name = tool.name.lower()
                      if any(word in name for word in [
                          "dividend", "temettu", "corporate",
                          "action", "sermaye"
                      ]):
                          found += 1
                          print("\nARAC:", tool.name)
                          print("PARAMETRELER:", tool.inputSchema)

                  if found == 0:
                      print("Bu isimlerle eslesen arac bulunamadi.")

                  print("\nTOPLAM ESLESEN ARAC:", found)

          asyncio.run(main())
          PY
