
name: Borsa MCP - Financial Tools Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketi kur
        working-directory: borsa-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Finansal araclari bul
        working-directory: borsa-mcp
        run: |
          python - <<'PY'
          import asyncio
          from fastmcp import Client
          from unified_mcp_server import app

          async def main():
              async with Client(app) as client:
                  tools = await client.list_tools()
                  found = 0

                  print("\n--- BILANCO VE FINANSAL ARACLAR ---")

                  for tool in tools:
                      name = tool.name.lower()
                      if any(word in name for word in [
                          "financial", "statement", "balance",
                          "bilanco", "income", "cash_flow"
                      ]):
                          found += 1
                          print("\nARAC:", tool.name)
                          print("PARAMETRELER:", tool.inputSchema)

                  print("\nTOPLAM BULUNAN:", found)

          asyncio.run(main())
          PY
