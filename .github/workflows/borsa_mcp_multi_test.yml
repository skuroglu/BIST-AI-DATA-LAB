
name: Borsa MCP - Financial Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketi kur
        working-directory: borsa-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Dört hissenin finansal tablolarini getir
        working-directory: borsa-mcp
        run: |
          python - <<'PY'
          import asyncio
          from fastmcp import Client
          from unified_mcp_server import app

          async def main():
              tickers = ["GARAN", "ISCTR", "AKBNK", "TSKB"]

              async with Client(app) as client:
                  print("Finansal tablo sorgusu basliyor...")

                  result = await client.call_tool(
                      "get_financial_statements",
                      {
                          "symbol": tickers,
                          "market": "bist",
                          "statement_type": "all",
                          "period": "quarterly",
                          "last_n": 8
                      }
                  )

              if result.is_error:
                  raise RuntimeError(str(result))

              if not result.content:
                  raise RuntimeError("Finansal veri bos geldi.")

              print("\n--- DORT BANKA FINANSAL TABLOLARI ---")

              for item in result.content:
                  print(getattr(item, "text", str(item)))

              print("\nFINANSAL VERI TESTI TAMAMLANDI.")

          asyncio.run(main())
          PY
