
name: Borsa MCP - Multi Stock Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketi kur
        working-directory: borsa-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Dort hisse kurumsal islemlerini sorgula
        working-directory: borsa-mcp
        run: |
          python - <<'PY'
          import asyncio
          from fastmcp import Client
          from unified_mcp_server import app

          async def main():
              tickers = ["GARAN", "ISCTR", "AKBNK", "TSKB"]

              async with Client(app) as client:
                  print("Dort hisse sorgusu basliyor:", tickers)

                  result = await client.call_tool(
                      "get_corporate_actions",
                      {
                          "symbol": tickers,
                          "market": "bist"
                      }
                  )

              if result.is_error:
                  raise RuntimeError(str(result))

              if not result.content:
                  raise RuntimeError("Sunucu bos yanit dondurdu.")

              print("\n--- KURUMSAL ISLEMLER SONUCU ---")

              for item in result.content:
                  print(getattr(item, "text", str(item)))

              print("\nCANLI COKLU HISSE TESTI TAMAMLANDI.")

          asyncio.run(main())
          PY
