name: Borsa MCP - Intraday Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intraday-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Borsa MCP paketini kur
        working-directory: borsa-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 5 dakikalik ve 15 dakikalik veri testi
        working-directory: borsa-mcp
        run: |
          python - <<'PY'
          import asyncio
          from fastmcp import Client
          from unified_mcp_server import app

          async def main():
              async with Client(app) as client:
                  for interval in ("5m", "15m"):
                      print(f"\\n========== {interval} TESTI ==========")
                      result = await client.call_tool(
                          "get_intraday_ohlc",
                          {
                              "symbol": "AKSA",
                              "interval": interval,
                              "period": "1d"
                          }
                      )

                      if result.is_error:
                          raise RuntimeError(
                              f"{interval} veri testi basarisiz: {result}"
                          )

                      if not result.content:
                          raise RuntimeError(
                              f"{interval} icin bos yanit dondu."
                          )

                      for item in result.content:
                          print(getattr(item, "text", str(item)))

                  print("\\n========== INTRADAY TESTLERI TAMAMLANDI ==========")

          asyncio.run(main())
          PY
