
name: Borsa MCP - Live BIST Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Borsa MCP paketini kur
        working-directory: borsa-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: GARAN canlı geçmiş verisini çek
        working-directory: borsa-mcp
        run: |
          python - <<'PY'
          import asyncio
          from fastmcp import Client
          from unified_mcp_server import app

          async def main():
              print("GARAN canlı veri sorgusu başlıyor...")

              async with Client(app) as client:
                  result = await client.call_tool(
                      "get_historical_data",
                      {
                          "symbol": "GARAN",
                          "market": "bist",
                          "period": "1mo"
                      }
                  )

              if result.is_error:
                  raise RuntimeError(str(result))

              if not result.content:
                  raise RuntimeError("Sunucu boş yanıt döndürdü.")

              print("\n--- GARAN SON 1 AY VERİSİ ---")

              for item in result.content:
                  if hasattr(item, "text"):
                      print(item.text)
                  else:
                      print(item)

              print("\nCANLI BIST VERİ TESTİ BAŞARILI.")

          asyncio.run(main())
          PY
