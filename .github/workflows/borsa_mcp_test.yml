
name: Borsa MCP - Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ./borsa-mcp
          pip install pytest pytest-asyncio

      - name: Çevrimdışı testleri çalıştır
        working-directory: borsa-mcp
        run: python -m pytest -q -k "not test_claude_md_does_not_present_removed_tools_as_available and not test_claude_md_states_the_real_tool_count and not test_live_golden_values"
